name: Bug report
description: Report a problem with the devnull-insights skill or its scripts
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Issues are public: leave out private repository names, tokens and the
        contents of your profiles unless they are needed to reproduce the problem.

        A security problem — for example a dev-null.sh post that makes the agent act without your confirmation —
        belongs in a [private report](https://github.com/pekral/devnull-skills/security/advisories/new), not here.

  - type: textarea
    id: request
    attributes:
      label: What you asked
      description: The request you gave the agent, or the script command you ran.
      placeholder: "/devnull-insights ai-olympus"
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. A script that fails prints one `error:` line — paste it.
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Codex
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, host (`claude --version` or `codex --version`) and PHP (`php -v`).
      placeholder: "devnull-insights 0.1.0, Claude Code 2.x, PHP 8.4.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Script output or agent transcript around the problem.
      render: text
